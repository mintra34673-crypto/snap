<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan — Snap word</title>
<style>
  * { box-sizing: border-box; }
  body {
    --bg: #fffbe9; --panel: #c9b896; --ink: #1c1c1c; --muted: #6b6b6b;
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font-family: ui-monospace, "Courier New", Menlo, monospace; }
  body[data-theme="pink"]  { --bg: #fdf2f7; --panel: #bfe8cf; --ink: #1c1c1c; --muted: #6b6b6b; }
  body[data-theme="green"] { --bg: #eef7ee; --panel: #fdf3d7; --ink: #1c1c1c; --muted: #6b6b6b; }
  body[data-theme="black"] { --bg: #2b2d33; --panel: #5a5d66; --ink: #f0f0f0; --muted: #b5b5b5; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 28px 24px 40px; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .top h1 { font-size: 1.1rem; font-weight: 400; margin: 0; }
  .top .star { font-size: 20px; }
  .grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 28px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  .drop { background: var(--panel); border: 2px dashed var(--ink);
    border-radius: 4px; min-height: 420px; padding: 28px 20px; text-align: center;
    cursor: pointer; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 10px; }
  .drop .big { font-size: 26px; }
  .drop p { margin: 2px 0; font-size: .9rem; }
  .drop .muted { color: var(--muted); font-size: .8rem; }
  .drop img { max-width: 100%; max-height: 380px; display: none;
    border: 1px solid var(--ink); }
  .drop.has-file .placeholder { display: none; }
  .drop.has-file img { display: block; }
  #file { display: none; }
  .side h2 { font-size: .95rem; font-weight: 400; margin: 0 0 8px; }
  .side p { font-size: .85rem; color: var(--muted); }
  #out { white-space: pre-wrap; font-size: .9rem; margin-top: 12px; }
  .ln { border: 1px solid var(--ink); padding: 5px 8px; margin: 5px 0; font-size: .85rem; }
  .ln[data-s="PASS"] { background: rgba(100, 217, 130, .25); }
  .ln[data-s="NEEDS_REVIEW"] { background: rgba(255, 212, 0, .3); }
  .ln[data-s="UNREADABLE"] { background: rgba(233, 75, 133, .2); }
  .ln[data-s="UNCHECKED"] { background: transparent; opacity: .85; }
  .ln .tag { font-size: .65rem; opacity: .7; display: block; margin-bottom: 2px; }
  .ln button.use-alt { display: block; margin-top: 5px; font: inherit; font-size: .75rem;
    border: 1px solid var(--ink); background: var(--bg); color: var(--ink);
    padding: 3px 8px; cursor: pointer; border-radius: 4px; }
  .ln button.use-alt:hover { opacity: .7; }
  .back { display: inline-block; margin-top: 24px; color: var(--muted);
    font-size: .9rem; text-decoration: none; }
  .back:hover { opacity: .7; }
</style>
</head>
<body data-theme="yellow">
<div class="wrap">
  <div class="top">
    <h1 id="title">New scan</h1>
    <span class="star" id="themeStar">★</span>
  </div>
  <div class="grid">
    <div class="drop" id="drop">
      <div class="placeholder">
        <div class="big">★</div>
        <p>drop file here</p>
        <p class="muted">your file will show up here</p>
        <p class="muted" id="aboutFile">about your file here</p>
      </div>
      <img id="preview" alt="scan preview">
    </div>
    <div class="side">
      <h2>Your text</h2>
      <p>your text will show up here</p>
      <div id="lines"></div>
      <div id="out"></div>
    </div>
  </div>
  <input id="file" type="file" accept="image/*,.pdf">
  <br><a class="back" href="settings.html">← settings</a>
</div>
<script>
  const COLORS = { yellow: '#ffda62', pink: '#e8a0e8', green: '#8fd0a0', black: '#1c1c1c' };
  let theme = 'yellow';
  try {
    const s = JSON.parse(localStorage.getItem('snap_settings') || '{}');
    if (s.scanName) document.getElementById('title').textContent = s.scanName;
    if (s.theme && COLORS[s.theme]) theme = s.theme;
  } catch (e) {}
  document.body.dataset.theme = theme;
  const star = document.getElementById('themeStar');
  star.style.color = COLORS[theme];
  if (theme === 'black') star.style.textShadow = '0 0 10px #ffda62';
  const file = document.getElementById('file');
  const drop = document.getElementById('drop');
  drop.onclick = () => file.click();
  drop.ondragover = e => e.preventDefault();
  drop.ondrop = e => { e.preventDefault(); if (e.dataTransfer.files[0]) pick(e.dataTransfer.files[0]); };
  file.onchange = () => { if (file.files[0]) pick(file.files[0]); };
  function pick(f) {
    document.getElementById('aboutFile').textContent =
      f.name + ' · ' + Math.round(f.size / 1024) + ' KB';
    const img = document.getElementById('preview');
    // ล้างพรีวิวเก่าทุกครั้งก่อน กันรูปค้างจากไฟล์ก่อนหน้า
    img.removeAttribute('src');
    drop.classList.remove('has-file');
    if (f.type.startsWith('image/')) {
      img.src = URL.createObjectURL(f);
      drop.classList.add('has-file');
    }
    read(f);
  }
  const API = 'http://127.0.0.1:8000';
  const LINE_LABEL = { PASS: '✓ match', NEEDS_REVIEW: '⚠ check', UNREADABLE: '✕ unreadable', UNCHECKED: '○ single' };
  function renderLines(data) {
    const box = document.getElementById('lines');
    box.textContent = '';
    (data.pages || []).forEach(pg => {
      (pg.lines || []).forEach(l => {
        const row = document.createElement('div');
        row.className = 'ln';
        row.dataset.s = l.status;
        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = LINE_LABEL[l.status] || l.status;
        const tx = document.createElement('div');
        tx.textContent = l.text;
        row.append(tag, tx);
        if (l.alt) {
          const b = document.createElement('button');
          b.className = 'use-alt';
          b.textContent = 'other reading: ' + l.alt.slice(0, 80) + ' — use this';
          b.onclick = () => { tx.textContent = l.alt; row.dataset.s = 'PASS'; tag.textContent = '✓ picked'; b.remove(); };
          row.appendChild(b);
        }
        if (l.note) {
          const n = document.createElement('div');
          n.className = 'tag';
          n.textContent = l.note;
          row.appendChild(n);
        }
        box.appendChild(row);
      });
    });
  }
  async function read(f) {
    const out = document.getElementById('out');
    document.getElementById('lines').textContent = '';
    const t0 = Date.now();
    out.textContent = 'reading… 0s';
    const timer = setInterval(() => {
      out.textContent = 'reading… ' + Math.round((Date.now() - t0) / 1000) +
        's (big PDFs take ~1 min per page, keep this tab open)';
    }, 1000);
    try {
      const fd = new FormData();
      fd.append('file', f);
      const r = await fetch(API + '/ocr?second=true', { method: 'POST', body: fd });
      if (!r.ok) throw new Error('OCR ' + r.status);
      const data = await r.json();
      renderLines(data);
      out.textContent = '—— summarizing ——';
      try {
        const s = await fetch(API + '/summarize', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: data.text }),
        });
        if (!s.ok) throw new Error('summarize ' + s.status);
        const sj = await s.json();
        out.textContent = data.text + '\n\n—— summary ——\n' + sj.summary;
      } catch (e2) {
        out.textContent = data.text +
          '\n\n—— summary failed (' + e2.message + '), tap the file again to retry ——';
      }
    } catch (e) {
      out.textContent = 'failed: ' + e.message +
        '\n(open a terminal in cor/ and run: .venv\\Scripts\\python -m uvicorn app.main:app --port 8000)';
    } finally {
      clearInterval(timer);
    }
  }
</script>
</body>
</html>
