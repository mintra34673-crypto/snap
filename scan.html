<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan — Snap word</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #fff;
    font-family: ui-monospace, "Courier New", Menlo, monospace;
    color: #1c1c1c; display: flex; align-items: center; justify-content: center; }
  .wrap { padding: 24px; width: min(560px, 94vw); text-align: center; }
  h1 { font-size: 1.2rem; font-weight: 400; margin: 0 0 8px; }
  .sub { color: #555; font-size: .9rem; margin-bottom: 20px; }
  .drop { border: 2px dashed #1c1c1c; border-radius: 24px; padding: 48px 20px;
    cursor: pointer; font-size: 1rem; }
  .drop:hover { background: #fafafa; }
  #file { display: none; }
  #preview { max-width: 100%; margin-top: 16px; display: none;
    border: 2px solid #1c1c1c; border-radius: 12px; }
  #fname { color: #555; font-size: .85rem; margin-top: 10px; min-height: 1.2em; }
  .back { display: inline-block; margin-top: 18px; color: #555; font-size: .9rem;
    text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">New scan</h1>
  <p class="sub">drop a photo here, or tap to choose one</p>
  <div class="drop" id="drop">Snap it 📷</div>
  <input id="file" type="file" accept="image/*">
  <p id="fname"></p>
  <img id="preview" alt="scan preview">
  <br><a class="back" href="settings.html">← settings</a>
</div>
<script>
  try {
    const s = JSON.parse(localStorage.getItem('snap_settings') || '{}');
    if (s.scanName) document.getElementById('title').textContent = s.scanName;
  } catch (e) {}
  const file = document.getElementById('file');
  const drop = document.getElementById('drop');
  drop.onclick = () => file.click();
  drop.ondragover = e => e.preventDefault();
  drop.ondrop = e => { e.preventDefault(); if (e.dataTransfer.files[0]) pick(e.dataTransfer.files[0]); };
  file.onchange = () => { if (file.files[0]) pick(file.files[0]); };
  function pick(f) {
    document.getElementById('fname').textContent = f.name;
    const img = document.getElementById('preview');
    img.src = URL.createObjectURL(f);
    img.style.display = 'block';
  }
</script>
</body>
</html>
